<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hype Squad Prompt</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#241245">
<meta name="apple-mobile-web-app-title" content="Hype Squad Prompt">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 20px;
      overflow-x: hidden;
      color: white;
      background: linear-gradient(135deg, #00145c, #0b2cff, #020024);
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .floating-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .float {
      position: absolute;
      bottom: -80px;
      color: gold;
      font-size: 34px;
      opacity: 0.75;
      animation: floatUp 12s linear infinite;
      text-shadow: 0 0 15px gold, 0 0 30px white;
    }

    .float:nth-child(1) {
      left: 8%;
      animation-delay: 0s;
    }

    .float:nth-child(2) {
      left: 22%;
      animation-delay: 3s;
      font-size: 26px;
    }

    .float:nth-child(3) {
      left: 40%;
      animation-delay: 6s;
    }

    .float:nth-child(4) {
      left: 58%;
      animation-delay: 2s;
      font-size: 28px;
    }

    .float:nth-child(5) {
      left: 73%;
      animation-delay: 5s;
    }

    .float:nth-child(6) {
      left: 88%;
      animation-delay: 8s;
      font-size: 30px;
    }

    @keyframes floatUp {
      0% {
        bottom: -80px;
        transform: translateX(0) rotate(0deg);
        opacity: 0;
      }

      15% {
        opacity: 0.85;
      }

      100% {
        bottom: 110%;
        transform: translateX(40px) rotate(360deg);
        opacity: 0;
      }
    }

    .vault-box {
      position: relative;
      z-index: 2;
      width: min(720px, 100%);
      margin: 50px auto;
      padding: 45px;
      border: 2px solid gold;
      border-radius: 28px;
      background: rgba(0, 0, 0, 0.78);
      box-shadow:
        0 0 25px gold,
        0 0 55px #ffffff,
        0 0 80px #0b2cff;
    }

    h1 {
      margin: 0 0 10px;
      color: gold;
      font-size: clamp(2.8rem, 8vw, 58px);
      text-shadow: 0 0 15px gold, 0 0 35px white;
    }

    h2 {
      color: gold;
      font-size: clamp(1.7rem, 5vw, 34px);
      text-shadow: 0 0 12px gold;
    }

    p {
      color: #f5f5f5;
      font-size: clamp(1rem, 2.5vw, 21px);
      line-height: 1.6;
    }

    .button {
      display: block;
      width: min(320px, 100%);
      margin: 22px auto;
      padding: 20px;
      border: 2px solid gold;
      border-radius: 18px;
      color: white;
      background: linear-gradient(135deg, #0b2cff, #001f8f);
      box-shadow: 0 0 15px #0b2cff, 0 0 25px gold;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
      transition:
        transform 0.3s ease,
        background 0.3s ease,
        color 0.3s ease,
        box-shadow 0.3s ease;
    }

    .button:hover,
    .button:focus-visible {
      color: black;
      background: linear-gradient(135deg, gold, #c99700);
      box-shadow: 0 0 30px gold, 0 0 55px white;
      transform: scale(1.06);
      outline: none;
    }

    .gold-button {
      color: black;
      background: linear-gradient(135deg, gold, #b8860b);
    }

    .outline-button {
      color: white;
      background: black;
    }

    .sparkle {
      color: gold;
      font-size: 28px;
      text-shadow: 0 0 12px gold;
    }

    @media (max-width: 600px) {
      body {
        padding: 20px 14px;
      }

      .vault-box {
        margin: 24px auto;
        padding: 28px 18px;
      }

      .button {
        padding: 17px;
        font-size: 17px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .float {
        animation: none;
      }

      .button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <div class="floating-bg" aria-hidden="true">
    <div class="float">🦋</div>
    <div class="float">✨</div>
    <div class="float">💫</div>
    <div class="float">🦋</div>
    <div class="float">✦</div>
    <div class="float">✨</div>
  </div>

  <main class="vault-box">
    <div class="sparkle">✨ 🦋 ✨</div>

    <h1>Hype Squad </h1>

    <h2>Enjoy</h2>

    <p>Hey</p>

    <a
      class="button"
      href="Hype Squad Chibi Generator "
      target="_blank"
      rel="noopener noreferrer"
    >
      Push
    </a>

    <a
      class="button gold-button"
      href="https://drive.google.com/file/d/1j_rBIS9LVcLc3fhsppVzUMxuUtTM06sA/view?usp=drive_link"
      target="_blank"
      rel="noopener noreferrer"
    >
      HOW-TO GUIDE
    </a>

    <a
      class="button"
      href="https://drive.google.com/file/d/1lRsC_N0SJT32J8aV6pLZuaJAvBG-yRiO/view?usp=sharing"
      target="_blank"
      rel="noopener noreferrer"
    >
      BONUS RESOURCE     </a>

    <a
      class="button gold-button"
      href="https://drive.google.com/file/d/1HhLLDpkyCi23jJJ5G5Q6I5DNFjTE92nG/view?usp=drive_link"
      target="_blank"
      rel="noopener noreferrer"
    >
      SELLING GUIDE
    </a>

    <a
      class="button outline-button"
      href="[PASTE COMMUNITY LINK HERE]"
      target="_blank"
      rel="noopener noreferrer"
    >
      [INSERT COMMUNITY BUTTON NAME]
    </a>

    <p>[INSERT FINAL MESSAGE]</p>
  </main>
</body>
</html>
